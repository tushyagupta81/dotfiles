# Status line Curve
set -g base-index 1
set -g pane-base-index 1
set -g status-position top
set -g status-bg default
set -g status-style bg=default,fg=black,bright
set -g status-left "#[fg=white]#{?client_prefix,#[bg=color105] tmux#[fg=color105]#[bg=default], tmux }"
set -g status-right "#[fg=color196,bg=default]#[fg=white, bg=color196]#S "
set-option -g status-justify centre

set -g window-status-format "#I.#W"
set -g window-status-current-format "#[fg=#eec35e,bg=default]#[fg=#1a170f,bg=#eec35e,bold]#I.#W#{?window_zoomed_flag, (zoom),}#[fg=#eec35e,bg=default]"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=white,nobold}"
set -g window-status-bell-style "fg=red,nobold"

# btop popup window
bind C-b display-popup -w 90% -h 90% -E "btop"

# List all tmux sessions
bind C-j display-popup -w 50% -h 50% -E 'tmux list-sessions | sed -E "s/:.*\$//" | grep -v "^$(tmux display-message -p "#S")\$" | grep -Ev "^popup(-.*)?\$" | fzf --reverse | xargs tmux switch-client -t'

# Create a new tmux session
bind C-o display-popup -E 'sesh'

bind -n C-Space run-shell "tmux-toggle-term 85% 85% white darkorange"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tushyagupta81/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

#Full screen into a pane
bind-key f resize-pane -Z 

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
